name: Temporary ML glossary bulk patch

on:
  push:
    branches:
      - "research/ml-glossary-bulk-20260910"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ml-glossary-bulk-20260910
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply and verify batch
        run: |
          python .github/tmp_ml_glossary_patch.py
          go run ./cmd/nlm glossary check
          go run ./cmd/nlm glossary generate
          go test ./...
          go build ./cmd/nlm
          rm .github/workflows/tmp-ml-glossary-bulk.yml
          rm .github/tmp_ml_glossary_patch.py
          rm -f .tmp-ml-glossary-trigger
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(glossary): bulk-verify machine-learning terms"
          git push origin HEAD:research/ml-glossary-bulk-20260910
