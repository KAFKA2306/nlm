name: Temporary research-data glossary bulk patch

on:
  push:
    branches: [agent/research-data-bulk-20260910]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/research-data-bulk-20260910
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Apply minimal canonical patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inv_path = Path('data/glossary/recent-term-inventory.yaml')
          inv = inv_path.read_text()
          replacements = {
              '  verified: 80\n  needs_review: 195\n  excluded_from_canonical_review: 19\n': '  verified: 84\n  needs_review: 188\n  excluded_from_canonical_review: 22\n',
              '- HF_TOKEN\nexcluded_from_canonical_review:\n': '- HF_TOKEN\n- Point-in-time vintage\n- Revision history\n- Facet\n- OAI-PMH\nexcluded_from_canonical_review:\n',
              '  - Documentation Quality Check\nneeds_review_by_domain:\n': '  - Documentation Quality Check\n  - Revision stage continuity\n  - Deduplicated canonical view\n  - Deterministic distribution layer\nneeds_review_by_domain:\n',
              '  research-data:\n  - Point-in-time vintage\n  - Revision stage\n  - Revision history\n  - Revision stage continuity\n  - Stable key\n  - Deduplicated canonical view\n  - Facet\n  - Primary category\n  - Deterministic distribution layer\n  - Atom API\n  - OAI-PMH\n': '  research-data:\n  - Revision stage\n  - Stable key\n  - Primary category\n  - Atom API\n',
          }
          for old, new in replacements.items():
              if old not in inv:
                  raise SystemExit(f'expected inventory block not found: {old!r}')
              inv = inv.replace(old, new, 1)
          inv_path.write_text(inv)

          terms_path = Path('data/glossary/terms.yaml')
          terms = terms_path.read_text()
          marker = '  - id: "point-in-time-vintage"\n'
          if marker in terms:
              raise SystemExit('research-data glossary patch already present')
          addition = r'''

  - id: "point-in-time-vintage"
    term: "Point-in-time vintage"
    aliases: ["data vintage", "vintage date"]
    domain: "research-data"
    definition_ja: "ある過去時点に利用可能だったデータの版。FRED/ALFREDではvintage dateを指定すると、その日付時点に存在したデータを取得できる。"
    why_it_matters: "後日の改訂値を過去の意思決定や再現実験へ混入させず、当時利用可能だった情報だけで分析するために重要。"
    example: "2024-01-31をvintage dateとして指定し、その時点で公表済みだった系列値だけを再取得する。"
    related_terms: ["revision-history"]
    sources:
      - title: "FRED series observations — vintage_dates"
        url: "https://fred.stlouisfed.org/docs/api/fred/series_observations.html"
        source_type: "official_docs"
    verified_at: "2026-09-10"
    status: "verified"

  - id: "revision-history"
    term: "Revision history"
    aliases: ["data revision history"]
    domain: "research-data"
    definition_ja: "データ系列の値が改訂された、または新しい値が公表された時点を追跡した履歴。FREDではseries vintage datesとして取得できる。"
    why_it_matters: "同じ観測期間でも公表時点によって値が変わるデータについて、どの版を使ったかと改訂の経路を再現するために重要。"
    example: "系列のvintage datesを取得し、初回公表値から後続改訂値までの変化を確認する。"
    related_terms: ["point-in-time-vintage"]
    sources:
      - title: "FRED series vintage dates"
        url: "https://fred.stlouisfed.org/docs/api/fred/series_vintagedates.html"
        source_type: "official_docs"
    verified_at: "2026-09-10"
    status: "verified"

  - id: "facet"
    term: "Facet"
    aliases: ["faceting"]
    domain: "research-data"
    definition_ja: "検索結果をindexed termに基づくcategoryへ分け、各categoryの一致件数とともに提示する絞り込みの仕組み。"
    why_it_matters: "大きな研究データ集合をcategoryごとに探索し、利用者が検索結果を段階的に絞り込むために重要。"
    example: "研究成果の検索結果をpublication yearやsubjectのfacet別件数で表示し、選択したfacetで絞り込む。"
    related_terms: []
    sources:
      - title: "Faceting — Apache Solr Reference Guide"
        url: "https://solr.apache.org/guide/solr/latest/query-guide/faceting.html"
        source_type: "official_docs"
    verified_at: "2026-09-10"
    status: "verified"

  - id: "oai-pmh"
    term: "OAI-PMH"
    aliases: ["Open Archives Initiative Protocol for Metadata Harvesting"]
    domain: "research-data"
    definition_ja: "repositoryがmetadataを公開し、harvesterがそれを収集するためのapplication-independentなmetadata harvesting interoperability protocol。"
    why_it_matters: "研究repository間でmetadataを一括収集・再利用するとき、独自scrapingではなく共通protocolでrecordsと更新範囲を扱うために重要。"
    example: "service providerがListRecordsを使い、repositoryから指定期間のmetadata recordsを収集する。"
    related_terms: []
    sources:
      - title: "Open Archives Initiative Protocol for Metadata Harvesting v2.0"
        url: "https://www.openarchives.org/OAI/2.0/openarchivesprotocol.htm"
        source_type: "official_standard_body"
    verified_at: "2026-09-10"
    status: "verified"
'''
          terms_path.write_text(terms.rstrip() + addition + '\n')
          PY
      - name: Generate glossary
        run: go run ./cmd/nlm glossary generate docs/glossary.md
      - name: Check glossary
        run: go run ./cmd/nlm glossary check
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/nlm
      - name: Check diff
        run: git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-research-data-bulk.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/glossary/terms.yaml data/glossary/recent-term-inventory.yaml docs/glossary.md .github/workflows/tmp-research-data-bulk.yml
          git commit -m "docs: verify research-data glossary batch"
          git push origin HEAD:agent/research-data-bulk-20260910
