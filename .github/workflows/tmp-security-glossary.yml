name: Apply security glossary batch

on:
  push:
    branches: [research/security-glossary-bulk-20260910]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[security-batch-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/security-glossary-bulk-20260910
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Apply patch
        run: python scripts/tmp_apply_security_glossary.py
      - name: Generate glossary
        run: go run ./cmd/nlm glossary generate docs/glossary.md
      - name: Check glossary
        run: go run ./cmd/nlm glossary check
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/nlm
      - name: Normalize final newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/glossary/terms.yaml')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/glossary/terms.yaml data/glossary/recent-term-inventory.yaml docs/glossary.md
          git commit -m "docs: verify security glossary batch [security-batch-applied]"
          git push origin HEAD:research/security-glossary-bulk-20260910
