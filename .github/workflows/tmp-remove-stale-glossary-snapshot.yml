name: Temporary stale glossary snapshot cleanup

on:
  push:
    branches:
      - research/remove-stale-glossary-snapshot-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/remove-stale-glossary-snapshot-20260909
      - name: Remove duplicated hand-maintained glossary state
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          replacement = (
              "### Current inventory\n\n"
              "件数とreview状態はREADMEへ複製せず、[`data/glossary/recent-term-inventory.yaml`](data/glossary/recent-term-inventory.yaml) を現在の抽出監査authorityとして参照します。"
              "検証済み定義の正本は [`data/glossary/terms.yaml`](data/glossary/terms.yaml)、人間向け生成ビューは [`docs/glossary.md`](docs/glossary.md) です。"
              "schemaは [`data/glossary/schema.json`](data/glossary/schema.json) にあります。\n\n"
              "inventoryは、この作業で取得できた直近ChatGPT会話コンテキストとrecent-work retrievalから抽出した監査集合です。"
              "**ChatGPT全履歴の完全exportとは扱いません。**\n\n"
              "### Promotion rule"
          )
          s2, n = re.subn(r"### Current snapshot[^\n]*\n.*?### Promotion rule", replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'current snapshot block replacements={n}')
          s3, n = re.subn(
              r"`needs_review` の語には、定義を推測して埋めません。現在は .*?検証待ちに含まれます。",
              "`needs_review` の語には、定義を推測して埋めません。現在のreview queueはREADMEへ複製せず、[`data/glossary/recent-term-inventory.yaml`](data/glossary/recent-term-inventory.yaml) を参照します。",
              s2,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'needs_review example replacements={n}')
          p.write_text(s3)
          PY
          ! grep -q 'verified.*29語' README.md
          ! grep -q 'needs_review.*265語' README.md
          ! grep -q 'RAG.*,.*PITR.*OIDC' README.md
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Remove stale glossary snapshot from README"
          git push origin HEAD:research/remove-stale-glossary-snapshot-20260909
