name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./cmd/nlm

      - name: Test
        run: go test ./...

      - name: Check glossary
        run: go run ./cmd/nlm glossary check

      - name: Generate glossary
        run: go run ./cmd/nlm glossary generate /tmp/glossary.md

      - name: Upload generated glossary
        uses: actions/upload-artifact@v4
        with:
          name: generated-glossary
          path: /tmp/glossary.md
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated glossary
        run: diff -u docs/glossary.md /tmp/glossary.md
