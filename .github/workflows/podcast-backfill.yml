name: Publish NotebookLM podcast backfill

# Never publish automatically on a code push. Publication requires an explicit
# workflow_dispatch with apply=true; the default is a dry run.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Include NotebookLM work on or after this JST date
        required: true
        type: string
        default: "2026-06-15"
      until:
        description: Optional inclusive JST end date (YYYY-MM-DD) or RFC3339
        required: false
        type: string
      apply:
        description: Explicitly upload audio and publish RSS (default dry run)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notebooklm-podcast-backfill
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SINCE: ${{ inputs.since }}
      UNTIL: ${{ inputs.until }}
      APPLY: ${{ inputs.apply }}
      NLM_AUTH_TOKEN: ${{ secrets.NLM_AUTH_TOKEN }}
      NLM_COOKIES: ${{ secrets.NLM_COOKIES }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"
          cache: true

      - name: Verify required credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          required=(NLM_AUTH_TOKEN NLM_COOKIES)
          if [ "$APPLY" = "true" ]; then
            required+=(IA_ACCESS_KEY IA_SECRET_KEY)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Verify backfill command
        run: go test ./cmd/podcast-backfill

      - name: Inspect NotebookLM audio and optionally publish
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --since "$SINCE"
            --feed podcast/feed.xml
            --pages-feed docs/feed.xml
            --archive-id kafka-podcast-vault-v2
          )
          if [ -n "$UNTIL" ]; then
            args+=(--until "$UNTIL")
          fi
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          log="$RUNNER_TEMP/podcast-backfill.log"
          if ! go run ./cmd/podcast-backfill "${args[@]}" >"$log" 2>&1; then
            echo "::error::Podcast backfill failed. Detailed output is suppressed because it may contain private NotebookLM titles."
            exit 1
          fi
          echo "Podcast backfill completed in apply=$APPLY mode. Private NotebookLM output was not published to Actions logs."

      - name: Verify canonical feeds are identical
        run: |
          cmp podcast/feed.xml docs/feed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('podcast/feed.xml')
          PY

      - name: Commit published episodes
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          git add podcast/feed.xml docs/feed.xml
          if git diff --cached --quiet; then
            echo "No new episodes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(podcast): publish NotebookLM bounded backfill"
          git push origin HEAD:main
