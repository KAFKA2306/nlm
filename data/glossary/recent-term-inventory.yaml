version: 1
extracted_at: '2026-08-14'
scope: Recent ChatGPT conversation context and recovered recent-work summaries available for this task, augmented with recent-conversation
  retrieval; not a claim of access to every historical chat transcript.
policy:
  purpose: Audit inventory of observed technical terms; not the canonical definition store.
  canonical_verified_store: data/glossary/terms.yaml
  promotion_rule: Promote a needs_review term only after its definition is supported by a primary source, standard, or original
    paper.
  review_rotation_rule: If a term cannot be unambiguously verified, keep it needs_review and move it to the tail of its domain queue.
  exclusions: Personal identifiers, secrets, credentials, account details, and ordinary non-technical words.
  coverage_note: Inventory records terms found in the recent context available to this task. It must not be described as a
    complete export of all ChatGPT history.
